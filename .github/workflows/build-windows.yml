
name: Compilar EXE para Windows

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pyinstaller

      - name: Compilar executável
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "SimuladorDePouso" main.py

      - name: Disponibilizar EXE
        uses: actions/upload-artifact@v4
        with:
          name: SimuladorDePouso-Windows
          path: dist/SimuladorDePouso.exe
